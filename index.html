<script>window.VTS_FIREBASE_CONFIG = {"apiKey": "AIzaSyAD6-LVPxfwIDEWSF3rx-6wnweLRpNdUlU", "authDomain": "audit-1d7ef.firebaseapp.com", "projectId": "audit-1d7ef", "storageBucket": "audit-1d7ef.firebasestorage.app", "messagingSenderId": "342062714810", "appId": "1:342062714810:web:c2e13965487d2a8eb59783", "measurementId": "G-ZZ0TT9V3L1"};</script>
<script>/* ───────── VTS Audit: طبقة Firebase بدل منصة Claude ─────────
   بتوفر نفس الواجهة اللي التطبيق متعود عليها: claude.use('db' | 'assets' | 'user' | 'downloads')
   - db: Cloud Firestore (مجموعة visits)
   - assets: الصور والفيديوهات متخزنة في Firestore نفسه (مجموعة photos) مقسمة أجزاء
   - user: حساب Firebase Auth + صلاحيات من مجموعة staff (الدور admin = المسؤول)
   - downloads: تنزيل عادي من المتصفح */
(function(){
  const CFG = window.VTS_FIREBASE_CONFIG;
  firebase.initializeApp(CFG);
  const auth = firebase.auth(), fs = firebase.firestore();
  try { fs.settings({ignoreUndefinedProperties: true, merge: true}); } catch (e) {}
  const CHUNK = 700000;                 // حروف base64 في كل جزء (أقل من حد الـ 1 ميجا للمستند)
  const MAX_BYTES = 1024 * 1024 * 1024; // الباقة المجانية: 1 جيجا

  let me = null, role = '', staffName = '';
  const ready = new Promise(res => { window.__fbReady = res; });

  /* ── الصور ── */
  const urls = new Map(), loading = new Map();
  const hex = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
  const toB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
  const fromB64 = (b64, type) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type: type || 'application/octet-stream'}); };
  async function getBlob(id){
    if (loading.has(id)) return loading.get(id);
    const p = (async () => {
      const m = await fs.collection('photos').doc(id).get();
      if (!m.exists) throw Object.assign(new Error('not_found'), {code: 'not_found'});
      const d = m.data(); let b64 = d.d || '';
      for (let i = 1; i < (d.n || 1); i++){ const c = await fs.collection('photos').doc(id + '_' + i).get(); b64 += c.exists ? (c.data().d || '') : ''; }
      const blob = fromB64(b64, d.t);
      if (!urls.has(id)) urls.set(id, URL.createObjectURL(blob));
      return blob;
    })();
    loading.set(id, p); p.catch(() => loading.delete(id));
    return p;
  }
  window.__blobURL = id => urls.get(id) || '';
  const idOf = s => { const m = String(s || '').match(/\/_blob\/([A-Za-z0-9_-]+)/); return m ? m[1] : null; };
  /* أي طلب لـ /_blob/<id> (التقرير والفيديو) بيتجاب من Firestore */
  const _fetch = window.fetch.bind(window);
  window.fetch = async (input, init) => {
    const u = typeof input === 'string' ? input : input && input.url;
    const id = idOf(u);
    if (id && (u.startsWith('/_blob/') || u.startsWith(location.origin + '/_blob/'))){
      try { await ready; return new Response(await getBlob(id), {status: 200}); } catch (e) { return new Response('', {status: 404}); }
    }
    return _fetch(input, init);
  };
  /* أي صورة في الصفحة مصدرها /_blob/ بتتحمل وتتعرض */
  const fix = el => {
    const s = el.getAttribute && el.getAttribute('src'); const id = idOf(s);
    if (!id || !s.startsWith('/_blob/') || el.dataset.fbl === id) return;
    el.dataset.fbl = id;
    ready.then(() => getBlob(id)).then(() => { if (el.getAttribute('src') === s) el.setAttribute('src', urls.get(id)); }).catch(() => {});
  };
  new MutationObserver(ms => { for (const m of ms){
    if (m.type === 'attributes') fix(m.target);
    else m.addedNodes.forEach(n => { if (n.nodeType !== 1) return; if (n.matches && n.matches('img,video,source')) fix(n); n.querySelectorAll && n.querySelectorAll('img,video,source').forEach(fix); });
  } }).observe(document.documentElement, {subtree: true, childList: true, attributes: true, attributeFilter: ['src']});

  const assets = {
    async upload(blob, opt){
      const id = hex(), type = (opt && opt.type) || blob.type || 'image/jpeg';
      const b64 = await toB64(blob), parts = [];
      for (let i = 0; i < b64.length; i += CHUNK) parts.push(b64.slice(i, i + CHUNK));
      if (!parts.length) parts.push('');
      for (let i = 1; i < parts.length; i++) await fs.collection('photos').doc(id + '_' + i).set({d: parts[i], p: id});
      await fs.collection('photos').doc(id).set({m: true, d: parts[0], n: parts.length, t: type, s: blob.size, at: new Date().toISOString(), u: me ? me.uid : ''});
      urls.set(id, URL.createObjectURL(blob));
      return {id, url: urls.get(id), sizeBytes: blob.size, contentType: type};
    },
    async delete(id){
      const m = await fs.collection('photos').doc(id).get();
      if (!m.exists) throw Object.assign(new Error('not_found'), {code: 'not_found'});
      const n = m.data().n || 1;
      for (let i = 1; i < n; i++) await fs.collection('photos').doc(id + '_' + i).delete();
      await fs.collection('photos').doc(id).delete();
      if (urls.has(id)){ URL.revokeObjectURL(urls.get(id)); urls.delete(id); }
    },
    async list(){
      const snap = await fs.collection('photos').where('m', '==', true).get();
      const all = snap.docs.map(d => { const x = d.data(); return {id: d.id, url: '/_blob/' + d.id, contentType: x.t, sizeBytes: x.s || 0, createdAt: x.at}; });
      return {assets: all, usage: {files: all.length, bytes: all.reduce((s, a) => s + a.sizeBytes, 0), maxFiles: 100000, maxBytes: MAX_BYTES}};
    }
  };

  /* ── الزيارات: المهندس بيشوف زياراته بس (حسب قواعد الحماية) ── */
  const isAdmin = () => role === 'admin';
  const db = {
    doc: p => fs.doc(p),
    collection(name){
      const base = fs.collection(name);
      if (name !== 'visits' || isAdmin()) return base;
      /* للمهندس: فلتر برقمه، والترتيب بيتعمل هنا عشان مانحتاجش index */
      const q = {orderBy: () => q, limit: () => q, where: () => q,
        onSnapshot(next, err){
          return base.where('engineerId', '==', me.uid).onSnapshot(s => {
            const docs = s.docs.slice().sort((a, b) => String(b.data().startedAt || '') < String(a.data().startedAt || '') ? -1 : 1);
            next({docs});
          }, err);
        },
        get: () => base.where('engineerId', '==', me.uid).get()};
      return q;
    }
  };
  const user = {
    isOwner: async () => isAdmin(), canEdit: () => isAdmin(), can: () => true,
    id: async () => me.uid,
    me: async () => ({id: me.uid, name: staffName || me.email}),
    async profiles(ids){
      const out = {}; ids.forEach(i => { out[i] = {name: ''}; });
      if (!isAdmin()) return out;
      try { const s = await fs.collection('staff').get(); s.docs.forEach(d => { const x = d.data(); if (x.uid && out[x.uid]) out[x.uid] = {name: x.name || d.id}; }); } catch (e) {}
      return out;
    }
  };
  /* التنزيل: على الموبايل بيطلع اختيار "مشاركة" (يروح لواتساب كـ PDF حقيقي بصورته) أو "حفظ" */
  const MIME = {pdf: 'application/pdf', html: 'text/html', csv: 'text/csv', json: 'application/json', png: 'image/png', jpg: 'image/jpeg'};
  const dlAnchor = (blob, filename) => {
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(u); }, 60000);
  };
  const downloads = {save: async ({filename, data}) => {
    const ext = (String(filename).split('.').pop() || '').toLowerCase(), type = MIME[ext] || (data && data.type) || 'application/octet-stream';
    const blob = new Blob([data], {type});
    let file = null; try { file = new File([blob], filename, {type}); } catch (e) {}
    const canShare = file && navigator.canShare && navigator.share && (() => { try { return navigator.canShare({files: [file]}); } catch (e) { return false; } })();
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
    if (!canShare || !mobile) return dlAnchor(blob, filename);
    await new Promise(done => {
      const el = document.createElement('div'); el.id = 'fb-share';
      el.innerHTML = `<div class="fbs-card"><div class="fbs-ic">${esc(ext.toUpperCase() || 'FILE')}</div><div class="fbs-n" dir="auto">${esc(String(filename).replace(/\.[a-z0-9]+$/i, ''))}</div>
        <button data-s="share">مشاركة (واتساب وغيره)</button><button data-s="save" class="fbs-2">حفظ على الموبايل</button><a data-s="x">إلغاء</a></div>`;
      document.body.appendChild(el);
      const close = () => { el.remove(); done(); };
      el.addEventListener('click', async e => {
        const s = e.target.closest('[data-s]'); if (!s && e.target !== el) return;
        const k = s ? s.dataset.s : 'x';
        if (k === 'share'){ try { await navigator.share({files: [file], title: filename}); } catch (err) { if (err && err.name !== 'AbortError') dlAnchor(blob, filename); } close(); }
        else if (k === 'save'){ dlAnchor(blob, filename); close(); }
        else close();
      });
    });
  }};
  window.claude = {use: async n => { await ready; return ({db, assets, user, downloads})[n] || null; }};

  /* ── إدارة المهندسين (للمسؤول) ── */
  window.__fbStaffCard = () => {
    if (!isAdmin()) return '';
    const L = window.__fbStaffList || [];
    return `<section class="card stack" style="gap:10px"><div class="card-head"><h2><bdi dir="ltr">Engineers &amp; Access</bdi></h2></div>
      <span class="small muted">ضيف إيميل المهندس هنا، وبعدها يفتح اللينك ويدوس "أول مرة؟ اعمل باسورد" بنفس الإيميل.</span>
      <div class="two-f"><label class="f">Email<input class="t" id="fb-se" dir="ltr" placeholder="name@gmail.com" autocomplete="off"></label>
      <label class="f">الاسم<input class="t" id="fb-sn" placeholder="م. ..." autocomplete="off"></label></div>
      <button class="btn sm" style="align-self:flex-start" data-fbact="add">إضافة مهندس</button>
      <details><summary class="small" style="cursor:pointer;color:var(--accent)">إضافة أكتر من مهندس مرة واحدة</summary>
        <div class="stack" style="gap:8px;margin-top:8px"><span class="small muted">الصق الإيميلات، كل واحد في سطر. ولو عاوز الاسم: الإيميل وبعده فاصلة والاسم.</span>
        <textarea class="t" id="fb-bulk" dir="ltr" rows="6" placeholder="ali@gmail.com, م. علي&#10;omar@gmail.com"></textarea>
        <button class="btn sm" style="align-self:flex-start" data-fbact="bulk">إضافة الكل</button></div></details>
      <div class="stack" style="gap:6px">${L.map(s => `<div style="display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px">
        <span style="flex:1"><b>${esc(s.name || '')}</b> <span class="small muted" dir="ltr">${esc(s.id)}</span>${s.role === 'admin' ? ' <span class="chip pass">Admin</span>' : ''}</span>
        ${s.role === 'admin' ? '' : `<button class="btn ghost sm" data-fbact="del" data-id="${esc(s.id)}">شيل</button>`}</div>`).join('') || '<span class="small muted">جاري التحميل…</span>'}</div></section>`;
  };
  const EMRE = /[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/;
  const cleanName = t => String(t || '').replace(/[,،;:<>()\u200e\u200f]+/g, ' ').replace(/\s+/g, ' ').trim();
  /* تصليح أي مهندس اتسجل والإيميل لازق فيه الاسم */
  async function repairStaff(docs){
    let fixed = 0;
    for (const d of docs){
      const id = d.id, x = d.data();
      if (/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(id)) continue;
      const m = id.match(EMRE); if (!m) continue;
      const em = m[0].toLowerCase();
      const nm = cleanName([cleanName(id.replace(m[0], ' ')), x.name && x.name !== id ? x.name : ''].filter(Boolean).join(' ')) || em;
      try { await fs.collection('staff').doc(em).set({...x, role: x.role === 'admin' ? 'admin' : 'engineer', name: nm}); await fs.collection('staff').doc(id).delete(); fixed++; } catch (e) {}
    }
    return fixed;
  }
  async function loadStaff(){
    try { let s = await fs.collection('staff').get();
      if (await repairStaff(s.docs)) s = await fs.collection('staff').get(); window.__fbStaffList = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (a.role === 'admin' ? -1 : 0) || String(a.name).localeCompare(String(b.name))); }
    catch (e) { window.__fbStaffList = []; }
    try { if (typeof S !== 'undefined' && S.view === 'dash' && typeof renderMain === 'function') renderMain(); } catch (e) {}
  }
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-fbact]'); if (!b) return;
    const a = b.dataset.fbact;
    if (a === 'logout'){ await auth.signOut(); location.reload(); return; }
    if (!isAdmin()) return;
    if (a === 'add'){
      let em = String(document.getElementById('fb-se').value || '').trim().toLowerCase(); const nm = String(document.getElementById('fb-sn').value || '').trim();
      const mm = em.match(EMRE); if (!mm){ toast('اكتب إيميل صح'); return; } em = mm[0].toLowerCase();
      await fs.collection('staff').doc(em).set({role: 'engineer', name: nm || em, addedAt: new Date().toISOString()});
      toast('اتضاف ' + (nm || em)); loadStaff();
    }
    if (a === 'bulk'){
      const lines = String(document.getElementById('fb-bulk').value || '').split(/[\n;]+/).map(l => l.trim()).filter(Boolean);
      const have = new Set((window.__fbStaffList || []).map(x => x.id)); let n = 0, bad = [];
      for (const l of lines){
        const m = l.match(EMRE); if (!m){ bad.push(l); continue; }
        const em = m[0].toLowerCase(); if (have.has(em)) continue;
        const nm = cleanName(l.replace(m[0], ' '));
        await fs.collection('staff').doc(em).set({role: 'engineer', name: nm || em, addedAt: new Date().toISOString()}); have.add(em); n++;
      }
      toast(`اتضاف ${n} مهندس` + (bad.length ? ` · ${bad.length} سطر مفيهوش إيميل` : '')); loadStaff(); return;
    }
    if (a === 'del' && confirmDel(b.dataset.id)){ await fs.collection('staff').doc(b.dataset.id).delete(); toast('اتشال'); loadStaff(); }
  });
  const confirmDel = id => window.confirm ? window.confirm('تشيل صلاحية ' + id + '؟ زياراته مش هتتمسح.') : true;

  /* ── شاشة الدخول ── */
  const LG = () => document.getElementById('fb-login');
  function showLogin(msg, mode){
    let el = LG();
    if (!el){ el = document.createElement('div'); el.id = 'fb-login'; document.body.appendChild(el); }
    mode = mode || 'in';
    const T = {in: ['تسجيل الدخول', 'دخول'], up: ['أول مرة؟ اعمل باسورد', 'إنشاء الحساب'], reset: ['نسيت الباسورد', 'ابعت لينك تغيير الباسورد']}[mode];
    el.innerHTML = `<div class="fbl-card">
      <img src="${typeof VTS_LOGO !== 'undefined' ? VTS_LOGO : ''}" alt="VTS" class="fbl-logo">
      <div class="fbl-eg">EGYPT</div>
      <div class="fbl-ey" dir="ltr">HATCHERY VACCINATION AUDIT</div>
      <h1 dir="ltr">Audit Report Checklist</h1>
      <h2>${T[0]}</h2>
      ${msg ? `<div class="fbl-msg">${msg}</div>` : ''}
      <label>الإيميل<input id="fbl-e" type="email" dir="ltr" autocomplete="username" value="${esc(localStorage.getItem('vts_last_email') || '')}"></label>
      ${mode === 'reset' ? '' : `<label>الباسورد<input id="fbl-p" type="password" dir="ltr" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}"></label>`}
      ${mode === 'up' ? `<label>اكتب الباسورد تاني<input id="fbl-p2" type="password" dir="ltr" autocomplete="new-password"></label>` : ''}
      <button id="fbl-go" data-mode="${mode}">${T[1]}</button>
      <div class="fbl-links">${mode !== 'in' ? '<a data-m="in">عندي حساب، دخول</a>' : '<a data-m="up">أول مرة؟ اعمل باسورد</a><a data-m="reset">نسيت الباسورد</a>'}</div>
      <div class="fbl-ft">VTS EGYPT · VAXCELLENCE 24/7</div></div>`;
    el.querySelectorAll('[data-m]').forEach(a => a.onclick = () => showLogin('', a.dataset.m));
    const go = el.querySelector('#fbl-go');
    el.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go.click(); });
    go.onclick = async () => {
      const em = String(el.querySelector('#fbl-e').value || '').trim().toLowerCase(), pw = el.querySelector('#fbl-p') ? el.querySelector('#fbl-p').value : '';
      if (!em) return showLogin('اكتب الإيميل', mode);
      try { localStorage.setItem('vts_last_email', em); } catch (e) {}
      go.disabled = true; go.textContent = '...';
      try {
        if (mode === 'in') await auth.signInWithEmailAndPassword(em, pw);

<style>
/* Layout: one-column phone app — navy header with step progress, white cards, sticky "next" bar at the bottom. */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#38BDF8; --accent-ink:#06121F; --link:#7DD3FC; --info-bg:#0C2A40; --info-fg:#BAE6FD;
  --pass:#34D399; --pass-bg:#0D2E24; --fail:#F87171; --fail-bg:#3A1518; --warn:#FBBF24; --warn-bg:#352A0B;
  --btn:#38BDF8; --btn-fg:#06121F; --overlay:rgba(0,0,0,.65); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --head:#060B16; --head-fg:#F1F5F9; --head-muted:#94A3B8; --head-line:#1E293B;
  --bg:#0B1220; --surface:#131C2E; --field:#0F1727; --fg:#E2E8F0; --muted:#A3B1C6; --line:#25324A;
  --accent:#38BDF8; --accent-ink:#06121F; --link:#7DD3FC; --info-bg:#0C2A40; --info-fg:#BAE6FD;

*{box-sizing:border-box}

.homebtn:hover{background:var(--head-line)}
.top .row{flex-wrap:wrap}
.progress{height:4px;border-radius:4px;background:var(--head-line);margin-top:14px;overflow:hidden}

.timer.opt{flex-wrap:wrap}.timer.opt .small{flex:1 1 100%}

:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--grid:#E2E8F0}

.good{color:var(--pass)}.low{color:var(--fail)}.mid{color:var(--warn)}

  return {rows, valid, q, e, by, pct: q ? Math.max(0,(q-e)/q*100) : null, points, onTarget};
}
function band(t){
  if (t == null) return {l:'لم تُقيَّم بعد', c:'none'};
  if (t >= 95) return {l:'ممتاز', c:'pass'};
  if (t >= 85) return {l:'جيد جداً', c:'pass'};
  if (t >= 75) return {l:'جيد', c:'warn'};
  if (t >= 60) return {l:'مقبول', c:'warn'};
  return {l:'ضعيف', c:'fail'};
}
function grade(v){
  const wc = workersCalc(v);
  const parts = PARTS.filter(p => p.k === 'workers' || secActive(v, p.k)).map(p => ({...p, s: p.k === 'workers' ? wc.points : sectionScore(v, p.k).pct}));
  const act = parts.filter(p => p.s != null), W = act.reduce((a,p)=>a+p.w,0);
  const total = W ? act.reduce((a,p)=>a+p.s*p.w,0)/W : null;
  return {parts, total, band: band(total == null ? null : Math.round(total)), wc};
}
const tone = s => s == null ? 'none' : s >= 85 ? 'pass' : s >= 60 ? 'warn' : 'fail';
const locked = () => S.visit?.status === 'submitted';

/* ───────── الشغل من غير نت ─────────
   كل حاجة بتتحفظ على الموبايل الأول (IndexedDB). لو النت موجود بتترفع على طول،
   ولو مش موجود بتستنى، وأول ما النت يرجع الصور والبيانات بتترفع لوحدها. */
const OFF = {p:null, urls:new Map(), dirty:new Set(), ver:{}, online: navigator.onLine !== false, busy:false, pendN:0, okT:null, shown:false};
const HARD = new Set(['invalid_request','too_large','unsupported_type','quota_or_state','not_granted','capability_disabled','capability_removed','invalid_argument','quota_exceeded','revoked','transform_error']);
const isNetErr = e => !HARD.has(e?.code);
const withT = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code: 'timeout'}), ms))]);
function idb(){
  if (OFF.p) return OFF.p;
  OFF.p = new Promise(res => { setTimeout(() => res(null), 4000); try { const r = indexedDB.open('vts_offline', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs'); if (!d.objectStoreNames.contains('visits')) d.createObjectStore('visits'); };
    r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); } catch { res(null); } });
  return OFF.p;
}
async function idbDo(store, mode, fn){ const d = await idb(); if (!d) return null;
  return new Promise(res => { setTimeout(() => res(null), 8000); try { const tx = d.transaction(store, mode), rq = fn(tx.objectStore(store)); tx.oncomplete = () => res(rq ? rq.result : null); tx.onerror = tx.onabort = () => res(null); } catch { res(null); } }); }
const idbGet = (st, k) => idbDo(st, 'readonly', o => o.get(k));
const idbPut = (st, k, v) => idbDo(st, 'readwrite', o => o.put(v, k));
const idbDel = (st, k) => idbDo(st, 'readwrite', o => o.delete(k));
const idbAll = st => idbDo(st, 'readonly', o => o.getAll());
const isLocalId = id => typeof id === 'string' && id.startsWith('L_');
const visitDoc = v => { const {id, _new, rno, _ci, ...doc} = v; return JSON.parse(JSON.stringify(doc)); };
const localIds = v => [...new Set(JSON.stringify(v).match(/L_[a-z0-9]{6,}/g) || [])];
async function cacheBlob(id, blob, vid){ if (isLocalId(id)) (OFF.mem ||= new Map()).set(id, blob); if (!OFF.urls.has(id)) OFF.urls.set(id, URL.createObjectURL(blob)); await idbPut('blobs', id, {id, blob, v: vid || '', at: Date.now()}); }
async function loadVisitBlobs(vid){ const all = await idbAll('blobs') || []; for (const r of all) if (r && r.blob && (r.v === vid || isLocalId(r.id)) && !OFF.urls.has(r.id)) OFF.urls.set(r.id, URL.createObjectURL(r.blob)); }
/* حفظ صورة: ترفع لو فيه نت، ولو مفيش تتحفظ على الموبايل وتترفع بعدين */
async function putImage(blob, type){
  const vid = S.visit?.id;
  if (!S.assets) throw {code: 'not_granted'};
  if (OFF.online && navigator.onLine !== false){
    try { const up = await withT(S.assets.upload(blob, {type}), 30000); cacheBlob(up.id, blob, vid); return up.id; }
    catch(e){ if (!isNetErr(e)) throw e; setOnline(false); }
  }
  const id = 'L_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  await cacheBlob(id, blob, vid); return id;
}
async function saveLocal(v){
  if (!v) return; OFF.dirty.add(v.id); OFF.ver[v.id] = (OFF.ver[v.id] || 0) + 1;
  await idbPut('visits', v.id, {id: v.id, doc: visitDoc(v), at: Date.now(), ver: OFF.ver[v.id]}); netPill();
}
function swapId(o, a, b){ if (!o || typeof o !== 'object') return; for (const k of Object.keys(o)){ const x = o[k]; if (x === a) o[k] = b; else if (x && typeof x === 'object') swapId(x, a, b); } }
async function syncAll(){
  if (OFF.busy || !OFF.dirty.size || !S.db || !S.assets) return;
  OFF.busy = true; netPill();
  try {
    for (const id of [...OFF.dirty]){
      const rec = await idbGet('visits', id); if (!rec){ OFF.dirty.delete(id); continue; }
      const open = S.visit?.id === id ? S.visit : null, ver0 = OFF.ver[id] || rec.ver || 0;
      let doc = open ? visitDoc(open) : rec.doc;
      for (const lid of localIds(doc)){
        const b = (await idbGet('blobs', lid)) || (OFF.mem?.has(lid) ? {blob: OFF.mem.get(lid), v: id} : null); let real = b?.alias;
        if (!real){ if (!b?.blob){ continue; } const up = await withT(S.assets.upload(b.blob, {type: b.blob.type === 'image/png' ? 'image/png' : 'image/jpeg'}), 45000); real = up.id;
          await idbPut('blobs', real, {id: real, blob: b.blob, v: b.v, at: Date.now()}); await idbPut('blobs', lid, {id: lid, alias: real}); }
        if (OFF.urls.has(lid) && !OFF.urls.has(real)) OFF.urls.set(real, OFF.urls.get(lid));
        swapId(doc, lid, real); if (open) swapId(open, lid, real);
        for (const x of S.visits) if (x.id === id) swapId(x, lid, real);
        netPill();
      }
      await withT(S.db.doc('visits/' + id).set({...doc, updatedAt: new Date().toISOString()}), 30000);
      if (open) open._new = false;
      if ((OFF.ver[id] || 0) === ver0 && !localIds(open || doc).length){ OFF.dirty.delete(id); await idbDel('visits', id); }
      else if (open) await saveLocal(open);
    }
    setOnline(true);
    if (!OFF.dirty.size){ OFF.okT = Date.now(); if (OFF.shown) toast('النت رجع، وكل الصور والبيانات اترفعت'); OFF.shown = false; }
  } catch(e){ if (isNetErr(e)) setOnline(false); else toast('في حاجة ماترفعتش (' + (e?.code || 'خطأ') + ')'); }
  finally { OFF.busy = false; netPill(); if (OFF.dirty.size && OFF.online) setTimeout(syncAll, 3000); }
}
function setOnline(x){ if (OFF.online === x) return; OFF.online = x; if (!x) OFF.shown = true; netPill(); }
function pendingPhotos(){ let n = 0; const seen = new Set(); for (const id of OFF.dirty){ const v = S.visit?.id === id ? S.visit : S.visits.find(x => x.id === id); if (v) for (const l of localIds(v)) if (!seen.has(l)){ seen.add(l); n++; } } return n; }
function netPill(){
  let el = document.getElementById('net'); if (!el){ el = document.createElement('div'); el.id = 'net'; el.setAttribute('role', 'status'); document.body.prepend(el); }
  const n = pendingPhotos(), off = !OFF.online || navigator.onLine === false;
  let cls = '', txt = '';
  if (OFF.dirty.size && OFF.busy && !off){ cls = 'sync'; txt = `جاري الرفع${n ? ` · فاضل ${n} صورة` : '…'}`; }
  else if (off){ cls = 'off'; txt = OFF.dirty.size ? `مفيش نت · محفوظ على الموبايل${n ? ` (${n} صورة)` : ''}` : 'مفيش نت · كمّل شغلك عادي'; }
  else if (OFF.dirty.size){ cls = 'sync'; txt = 'مستني يرفع…'; }
  else if (OFF.okT && Date.now() - OFF.okT < 4000){ cls = 'ok'; txt = 'كله اترفع'; setTimeout(netPill, 4100); }
  el.className = cls; el.hidden = !cls; el.innerHTML = cls ? `<i></i>${txt}` : '';
  document.body.classList.toggle('has-net', !!cls);
}
window.addEventListener('online', () => { OFF.online = true; netPill(); syncAll(); });
window.addEventListener('offline', () => setOnline(false));
setInterval(() => { if (OFF.dirty.size) syncAll(); else if (!OFF.online && navigator.onLine !== false){ OFF.online = true; netPill(); } }, 15000);

/* ───────── الكتابة ───────── */
let pending = {}, saveT = null;
function patch(fields, now=false){
  if (!S.db || !S.visit) return;
  Object.assign(pending, fields);
  clearTimeout(saveT);
  const go = async () => {
    const body = pending; pending = {};
    const v = S.visit; if (!v) return;
    if (OFF.dirty.has(v.id) || !OFF.online || navigator.onLine === false || localIds(v).length){ await saveLocal(v); syncAll(); return; }
    try {
      if (v._new){
        // الزيارة بتتحفظ أول مرة بس لما حد يكتب أو يعلّم حاجة فيها
        v._new = false;
        const {_new, id, ...doc} = v;
        try { await withT(S.db.doc('visits/' + id).set({...doc, updatedAt:new Date().toISOString()}), 20000); } catch(e){ v._new = true; throw e; }
      } else {
        await withT(S.db.doc('visits/' + v.id).update({...body, updatedAt:new Date().toISOString()}), 20000);
      }
    }
    catch(e){ if (isNetErr(e)){ setOnline(false); await saveLocal(v); } else toast('ماتحفظش التعديل، جرّب تاني (' + (e.code||'خطأ') + ')'); }
  };
  if (now) return go(); saveT = setTimeout(go, 500);
}
function setResult(id, val){
  const cur = S.visit.results[id] || {};
  const next = {...cur, ...val};
  S.visit.results[id] = next;
  patch({results:{[id]: next}}, true);
}

function workerImportCard(v){

  v.clients.forEach((c, i) => { if (i === v.ci) return; for (const w of (c.workers || [])){ const n = String(w.name || '').trim(); if (!n || seen.has(n)) continue; seen.add(n); pool.push({name: n, photo: w.photo || null, from: clName(v, i)}); } });

function pendingList(v, solo){

    if (!v.results?.[it.id]?.r) out.push({step: STEP[it.section], id: it.id, label: it.label});
    if (it.photo && !hasPhoto(v, it.id) && !noPh(v, it.id)) out.push({step: STEP[it.section], id: it.id, label: 'صورة: ' + it.label});
  }
  for (const k of FORM_SECS) if (secActive(v, k) && SEC_PH[k]){ const c = SEC_PH[k], n = (v.photos || []).filter(p => p.item === c.id).length; if (n < c.min && !noPh(v, c.id)) out.push({step: STEP[k], id: c.id, label: `${c.title} (${n} من ${c.min} على الأقل)`}); }

  if (!v.vsrc) out.push({step: 0, id: 'vsrc', label: 'مصدر اللقاح (مخزن أساسي / فرعي)', info: true});
  if (String(v.oil || '').trim() && !(parseInt(v.oilAmps, 10) > 0)) out.push({step: 0, id: 'oilAmps', label: 'عدد أمبولات التحصين الزيتي', info: true});

async function compress(file, maxSide=1600, q=.78){
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*scale); cv.height = Math.round(bmp.height*scale);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
  } catch { return file; }
}

const VMAX = 19 * 1024 * 1024;   // حد رفع الملف 20 ميجا
/* نافذة التجهيز: الفيديو بيتعرض فيها وهو بيتجهز (لازم يكون ظاهر عشان الموبايل مايوقفوش) */
function vOverlay(){
  let ov = document.getElementById('vproc');
  if (!ov){
    ov = document.createElement('div'); ov.id = 'vproc'; ov.className = 'overlay center';
    ov.innerHTML = `<div class="busy vbusy" role="status"><div class="vbox"></div><b id="vtitle">تجهيز الفيديو</b>
      <div class="vprog" style="width:100%"><i id="vprog2" style="width:0%"></i></div><span class="small muted" id="vmsg2"></span>
      <span class="small muted">خلّي الصفحة مفتوحة والشاشة شغالة لحد ما يخلص</span></div>`;
    document.body.appendChild(ov);
  }
  return ov;
}
function closeVOverlay(){ document.getElementById('vproc')?.remove(); }
function loadVideo(file){
  return new Promise((res, rej) => {
    const el = document.createElement('video');
    el.muted = true; el.defaultMuted = true; el.playsInline = true; el.setAttribute('playsinline',''); el.setAttribute('muted',''); el.preload = 'auto';
    vOverlay().querySelector('.vbox').appendChild(el);
    const url = URL.createObjectURL(file);
    const done = ok => { clearTimeout(t); ok ? res({el, url}) : (cleanupVideo({el, url}), rej({code:'bad_video'})); };
    const t = setTimeout(() => done(false), 25000);
    el.onloadedmetadata = () => done(true);
    el.onerror = () => done(false);
    el.src = url; el.load();
  });
}
function cleanupVideo(o){ try { o.el.pause(); o.el.removeAttribute('src'); o.el.load(); o.el.remove(); URL.revokeObjectURL(o.url); } catch {} }
const waitEv = (el, ev, ms=6000) => new Promise(r => { const t = setTimeout(r, ms); el.addEventListener(ev, () => { clearTimeout(t); r(); }, {once:true}); });
async function grabFrame(el, t){
  try {
    if (el.readyState < 2){ el.play().catch(()=>{}); await waitEv(el, 'loadeddata', 5000); el.pause(); }
    el.currentTime = t; await waitEv(el, 'seeked', 4000);
    const w = el.videoWidth, h = el.videoHeight; if (!w || !h) return null;
    const sc = Math.min(1, 640 / Math.max(w, h)), cv = document.createElement('canvas');
    cv.width = Math.round(w*sc); cv.height = Math.round(h*sc);
    cv.getContext('2d').drawImage(el, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', .8));
  } catch { return null; }
}
async function transcode(el, dur, onP){
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw {code:'no_transcode'};
  if (dur > 600) throw {code:'too_long'};
  const mime = ['video/mp4;codecs=avc1.42E01E','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp8','video/webm;codecs=vp9','video/webm'].find(m => { try { return MediaRecorder.isTypeSupported(m); } catch { return false; } });
  if (!mime || !el.videoWidth) throw {code:'no_transcode'};
  const sc = Math.min(1, 854 / Math.max(el.videoWidth, el.videoHeight));
  const cv = document.createElement('canvas'); cv.width = Math.round(el.videoWidth*sc/2)*2; cv.height = Math.round(el.videoHeight*sc/2)*2;
  const ctx = cv.getContext('2d');
  const bps = Math.round(Math.max(300e3, Math.min(2e6, (15*8*1024*1024) / Math.max(dur, 1))));
  const stream = cv.captureStream(25);
  const rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: bps});
  const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => rec.onstop = r);
  el.pause(); el.currentTime = 0; await waitEv(el, 'seeked', 3000);
  ctx.drawImage(el, 0, 0, cv.width, cv.height);
  rec.start(1000);
  let fin = false, last = -1, lastAt = Date.now();
  const draw = () => { if (fin) return; ctx.drawImage(el, 0, 0, cv.width, cv.height); onP(Math.min(.99, el.currentTime / (dur || 1)));
    if (el.requestVideoFrameCallback) el.requestVideoFrameCallback(draw); else requestAnimationFrame(draw); };
  const ended = new Promise((res, rej) => {
    el.onended = res;
    // مراقبة: لو الفيديو وقف لوحده نشغله تاني، ولو فضل واقف كتير نوقف بخطأ واضح
    const wd = setInterval(() => {
      if (fin){ clearInterval(wd); return; }
      if (el.ended){ clearInterval(wd); res(); return; }
      if (el.currentTime !== last){ last = el.currentTime; lastAt = Date.now(); }
      if (el.paused) el.play().catch(()=>{});
      if (dur && el.currentTime >= dur - 0.15){ clearInterval(wd); res(); return; }
      if (Date.now() - lastAt > 15000){ clearInterval(wd); rej({code:'stalled'}); }
    }, 1000);
  });
  try { await el.play(); } catch { throw {code:'stalled'}; }
  draw();
  try { await ended; } finally { fin = true; try { rec.stop(); } catch {} }
  await stopped;
  stream.getTracks().forEach(t => t.stop());
  const blob = new Blob(chunks, {type: mime.split(';')[0]});
  if (!blob.size) throw {code:'no_transcode'};
  if (blob.size > 20*1024*1024) throw {code:'too_large'};
  return blob;
}
function setVProg(p, msg){
  if (!S.vbusy) return; S.vbusy.p = p; if (msg) S.vbusy.msg = msg;
  for (const id of ['vprog','vprog2']){ const b = document.getElementById(id); if (b) b.style.width = Math.round(p*100) + '%'; }
  if (msg) for (const id of ['vmsg','vmsg2']){ const m = document.getElementById(id); if (m) m.textContent = msg; }
}
async function uploadVideoRaw(file){
  return S.assets.upload(file, {type: file.type === 'video/webm' ? 'video/webm' : 'video/mp4'});
}
async function onVideo(e){
  const file = e.target.files?.[0]; e.target.value = '';
  clearTimeout(S.srcT); $('#modal').innerHTML = '';
  const tgt = S.videoTarget; S.videoTarget = null;
  if (!file || !tgt || !S.visit) return;
  S.vbusy = {...tgt, p:0, msg:'جاري قراءة الفيديو…'}; render();
  vOverlay(); setVProg(0, 'جاري قراءة الفيديو…');
  let vid = null, up = null, thumb = null, dur = 0;
  try {
    try { vid = await loadVideo(file); } catch { vid = null; }
    if (vid){
      dur = Number.isFinite(vid.el.duration) ? vid.el.duration : 0;
      setVProg(.02, 'جاري تجهيز صورة مصغّرة…');
      thumb = await grabFrame(vid.el, Math.min(1, dur/3 || 0));
    }
    // mp4/webm صغير بيترفع زي ما هو. فيديو الآيفون (mov) بيتحوّل عشان يشتغل على أي موبايل.
    const direct = ['video/mp4','video/webm'].includes(file.type) && file.size <= VMAX;
    if (direct || (!vid && file.size <= VMAX)){
      setVProg(.4, 'جاري رفع الفيديو…');
      try { up = await uploadVideoRaw(file); }
      catch(err){ if (!vid || !['unsupported_type','too_large','invalid_request'].includes(err.code)) throw err; }
    }
    if (!up){
      if (!vid) throw {code:'bad_video'};
      setVProg(0, 'جاري تصغير الفيديو…');
      try {
        const blob = await transcode(vid.el, dur, p => setVProg(p * .9, `جاري تصغير الفيديو… ${Math.round(p*100)}%`));
        setVProg(.92, 'جاري رفع الفيديو…');
        up = await S.assets.upload(blob, {type: blob.type});
      } catch(err){
        // لو التصغير ماشتغلش والفيديو صغير كفاية، نرفعه زي ما هو
        if (file.size <= VMAX){ setVProg(.5, 'جاري رفع الفيديو…'); up = await uploadVideoRaw(file); }
        else throw err;
      }
    }
    setVProg(.97, 'جاري الحفظ…');
    let thumbId = null;
    if (thumb){ try { thumbId = (await S.assets.upload(thumb, {type:'image/jpeg'})).id; } catch {} }
    const old = (S.visit.videos || []).filter(x => x.item === tgt.item && x.slot === tgt.slot);
    const entry = {asset: up.id, thumb: thumbId, item: tgt.item, slot: tgt.slot, dur: Math.round(dur), at: new Date().toISOString()};
    S.visit.videos = [...(S.visit.videos || []).filter(x => !(x.item === tgt.item && x.slot === tgt.slot)), entry];
    await patch({videos: S.visit.videos}, true);
    for (const o of old){ try { await S.assets.delete(o.asset); if (o.thumb) await S.assets.delete(o.thumb); } catch {} }
    toast('اتحفظ الفيديو');
  } catch(err){
    console.warn('video', err);
    const m = {too_large:'الفيديو كبير قوي. صوّر فيديو أقصر (أقل من دقيقة).', too_long:'الفيديو أطول من 10 دقايق. صوّر فيديو أقصر.',
      no_transcode:'المتصفح ده مش بيقدر يصغّر الفيديو. صوّر فيديو أقصر (حوالي 15 ثانية) وجرّب تاني.',
      stalled:'تجهيز الفيديو وقف. خلّي الشاشة مفتوحة وجرّب تاني، أو صوّر فيديو أقصر.',
      bad_video:'الموبايل مش قادر يقرا الفيديو ده. صوّره تاني من زرار الكاميرا.'};
    toast(m[err.code] || 'مارفعتش الفيديو (' + (err.code || 'خطأ') + ')');
  } finally {
    if (vid) cleanupVideo(vid);
    closeVOverlay();
    S.vbusy = null; render();
  }
}

/* لو المتصفح ماعرفش يشغّل الفيديو من الرابط مباشرة، نحمّله ونشغّله من الذاكرة */
document.addEventListener('error', e => {
  const v = e.target;
  if (!v || v.tagName !== 'VIDEO' || v.dataset.fb || !String(v.getAttribute('src')||'').startsWith('/_blob/')) return;
  v.dataset.fb = '1';
  fetch(v.getAttribute('src')).then(r => r.blob()).then(b => { v.src = URL.createObjectURL(b.type ? b : new Blob([b], {type:'video/mp4'})); }).catch(() => {});
}, true);

/* ───────── تقرير PDF ───────── */
/* تحميل صور التقرير: 4 صور في نفس الوقت بس، ولو صورة فشلت تتعاد لحد 4 مرات عشان النت الضعيف */
const IMGQ = {n: 0, w: []};
const imgLock = () => new Promise(r => { if (IMGQ.n < 4){ IMGQ.n++; r(); } else IMGQ.w.push(r); });
const imgFree = () => { const nx = IMGQ.w.shift(); if (nx) nx(); else IMGQ.n--; };
async function toDataUrl(id, maxSide){
  if (!id) return '';
  await imgLock();
  try {
    for (let k = 0; k < 4; k++){
      try {
        const res = await fetchT(blobUrl(id), 40000);
        if (!res.ok) throw new Error('http ' + res.status);
        let b = await res.blob(); if (!b.size) throw new Error('empty');
        if (maxSide) b = await compress(b, maxSide, .82);
        return await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(b); });
      } catch(e){ if (k < 3) await new Promise(r => setTimeout(r, 900 * (k + 1))); }
    }
    return '';
  } finally { imgFree(); }
}
const fetchT = (url, ms=6000) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(url, {signal:c.signal}).finally(() => clearTimeout(t)); };
async function embedFonts(){
  if (embedFonts.c != null) return embedFonts.c;
  try {
    const css = await (await fetchT('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap')).text();
    const blocks = css.match(/@font-face\s*{[^}]*}/g) || [];
    const keep = blocks.filter(b => /U\+06|U\+0000-00FF/i.test(b));
    const out = await Promise.all(keep.map(async b => {
      const url = (b.match(/url\(([^)]+)\)/) || [])[1]; if (!url) return '';
      const buf = await (await fetchT(url.replace(/['"]/g,''))).blob();
      const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(buf); });
      return b.replace(/font-family:[^;]+;/, "font-family:'RPF';").replace(/url\([^)]+\)/, `url(${data})`);
    }));
    embedFonts.c = out.join('\n');
  } catch { embedFonts.c = ''; }
  return embedFonts.c;
}

  rows.forEach((r, i) => { const yc = i*rh + rh/2, w = r.n/mx*(x1 - x0);
    g += `<text x="${W-2}" y="${yc+4}" text-anchor="end" font-size="11" font-weight="600" fill="${CORP.ink}">${r.t.l}</text>
      <rect x="${x0}" y="${yc-bh/2}" width="${x1-x0}" height="${bh}" fill="#F1F4F8"/>
      ${r.n ? `<rect x="${x1-w}" y="${yc-bh/2}" width="${w}" height="${bh}" fill="${i === 0 && r.n ? CORP.navy : CORP.navy2}"/>` : ''}
      <text x="${x0-8}" y="${yc+4}" text-anchor="end" font-size="11" font-weight="700" fill="${CORP.ink}">${r.n}<tspan font-weight="400" fill="${CORP.muted}" font-size="10"> ⁦(${tot ? Math.round(r.n/tot*100) : 0}%)⁩</tspan></text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="direction:ltr;display:block" ${FONT}>${g}</svg>`;
}
/* مصفوفة الأخطاء: محصن × نوع الخطأ */
function corpMatrix(rows){
  rows = [...rows].sort((a,b) => b.e - a.e || a.pct - b.pct);
  const shade = n => CORP.tint[Math.min(4, n)];
  return `<table class="cm"><thead><tr><th>المحصن</th>${ERR.map(t => `<th>${t.l}</th>`).join('')}<th>الإجمالي</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="n">${esc(r.name)}</td>${ERR.map(t => { const n = r.by[t.k]; return `<td style="background:${shade(n)};${n >= 3 ? 'color:#fff;' : ''}">${n || '–'}</td>`; }).join('')}<td class="t">${r.e}</td></tr>`).join('')}</tbody></table>`;
}
/* نسبة كل عينة */
function corpSamples(v){
  const ws = (v.workers || []).map((w, i) => ({name: w.name?.trim() || `محصن ${i+1}`, s: (w.s||[]).map(sampleCalc), f: workerCalc(w).pct})).filter(w => w.f != null);
  if (!ws.length) return '';
  const n = Math.max(...ws.map(w => w.s.length));
  const cell = p => p == null ? '<td class="e">–</td>' : `<td class="${p <= RED_AT ? 'lo' : ''}">⁦${cpct(p)}⁩</td>`;
  return `<table class="cs"><thead><tr><th>المحصن</th>${Array.from({length:n}, (_, k) => `<th>عينة ${k+1}</th>`).join('')}<th>النسبة النهائية</th></tr></thead><tbody>
    ${ws.map(w => `<tr><td class="n">${esc(w.name)}</td>${Array.from({length:n}, (_, k) => cell(w.s[k]?.pct ?? null)).join('')}<td class="f ${w.f <= RED_AT ? 'lo' : ''}">⁦${cpct(w.f)}⁩</td></tr>`).join('')}</tbody></table>
    <div class="cnote">الخانات باللون الأحمر ⁦${RED_AT}%⁩ أو أقل. حد المطابقة ⁦${TARGET}%⁩.</div>`;
}

/* توزيع البلوكات على صفحات: الجداول بتتقسم بين الصفحات وبيتكرر عنوانها */
const tplEl = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
function paginate(host, blocks, v){
  const pages = [];
  const header = `<div class="ph"><div class="brand"><img class="hlogo" src="${VTS_LOGO}" alt="VTS"><div><div class="t1" dir="ltr" style="text-align:right">Vaccination Audit Report</div><div class="t2">${esc(siteName(v))}${v.team ? ` · <span dir="ltr">${TEAMS[v.team]}</span>` : ''}</div></div></div>
    <div class="meta"><span dir="ltr">Flock:</span> <b>${esc(v.flock || '—')}</b><br><span dir="ltr">Visit Date:</span> <b>${fmtDate(v.startedAt)}</b></div></div>`;
  const newPage = () => { const el = tplEl(`<div class="page${pages.length ? '' : ' first'}">${header}<div class="pb"></div><div class="pf"><span class="vxt">VTS EGYPT · VAXCELLENCE <em>24/7</em></span><span class="pn"></span><span><span dir="ltr">Engineer:</span> ${esc(v.engineerName || '—')}</span></div></div>`);
    host.appendChild(el); const p = {el, body: el.querySelector('.pb'), knEl: null}; pages.push(p); return p; };
  const over = b => b.scrollHeight > b.clientHeight + 1;
  let cur = newPage();
  const place = (el, kn) => {
    el.classList.add('blk'); cur.body.appendChild(el);
    if (over(cur.body) && cur.body.children.length > 1){
      el.remove(); const carry = cur.knEl && cur.knEl === cur.body.lastElementChild && cur.body.children.length > 1 ? cur.knEl : null;
      if (carry) carry.remove();
      cur = newPage(); if (carry) cur.body.appendChild(carry); cur.body.appendChild(el);
    }
    if (kn) el.classList.add('kn');
    cur.knEl = kn ? el : null;
  };
  const mkTable = t => tplEl(`<table class="${t.cls||''}">${t.cols||''}<thead>${t.head}</thead><tbody></tbody></table>`);
  for (const B of blocks){
    if (B.br){ if (cur.body.children.length){ cur = newPage(); cur.forced = true; } continue; }
    if (!B.t){ place(tplEl(B.h), B.kn); continue; }
    const t = B.t; let tbl = mkTable(t); tbl.classList.add('blk'); cur.body.appendChild(tbl); let rows = 0;
    const tb = () => tbl.tBodies[tbl.tBodies.length - 1];
    const add = u => { const el = tplEl(u.h.startsWith('<tbody') ? u.h : `<table><tbody>${u.h}</tbody></table>`);
      if (u.h.startsWith('<tbody')){ tbl.appendChild(el); return el; } const tr = el.querySelector('tr'); tbl.tBodies[0].appendChild(tr); return tr; };
    for (const u of t.units){
      let el = add(u);
      if (over(cur.body)){
        el.remove();
        let carry = [];
        if (rows === 0){
          tbl.remove(); const k = cur.knEl && cur.knEl === cur.body.lastElementChild && cur.body.children.length > 1 ? cur.knEl : null; if (k){ k.remove(); carry.push(k); }
          cur = newPage(); carry.forEach(c => cur.body.appendChild(c));
        } else {
          const prev = el.previousElementSibling || tbl.tBodies[0].lastElementChild;
          const lastRow = tbl.tBodies[0].lastElementChild;
          if (lastRow && lastRow.classList.contains('grp') && rows > 1){ lastRow.remove(); carry.push(lastRow); }
          cur = newPage(); cur.body.appendChild(tplEl(`<div class="cont" dir="ltr">Continued: ${t.cont}</div>`));
        }
        tbl = mkTable(t); tbl.classList.add('blk'); cur.body.appendChild(tbl);
        carry.filter(c => c.tagName === 'TR').forEach(c => tbl.tBodies[0].appendChild(c));
        el = add(u); rows = 0;
      }
      rows++;
    }
    cur.knEl = null;
  }
  tidyPages(pages, over);
  pages.forEach((p, i) => { p.el.querySelector('.pn').textContent = `Page ${i+1} of ${pages.length}`; });
  return pages;
}
/* تنسيق الصفحات بعد التوزيع: مفيش صفحة تطلع فيها سطر أو صورة لوحدها.
   1) لو الباقي صغير: يرجع للصفحة اللي قبله وتتصغر شوية (لحد 84%) عشان يكفي.
   2) لو مايكفيش: ننقل آخر جزء من الصفحة اللي قبله عشان الصفحتين يبقوا متوازنين. */
function tidyPages(pages, over){
  const used = b => { const l = b.lastElementChild; if (!l) return 0; const r0 = b.getBoundingClientRect(), r = l.getBoundingClientRect(); return r.bottom - r0.top + 12; };
  const unwrap = b => { const z = b.querySelector(':scope > .zw'); if (z){ while (z.firstChild) b.insertBefore(z.firstChild, z); z.remove(); } };
  const wrap = (b, s) => { let z = b.querySelector(':scope > .zw'); if (!z){ z = document.createElement('div'); z.className = 'zw'; while (b.firstChild) z.appendChild(b.firstChild); b.appendChild(z); }
    z.style.transform = `scale(${s})`; z.style.width = (100 / s) + '%'; return z; };
  const fits = (b, s) => { const z = b.querySelector(':scope > .zw'); return s >= 1 || !z ? !over(b) : z.offsetHeight * s <= b.clientHeight + 1; };
  for (let i = 1; i < pages.length; i++){
    const p = pages[i], prev = pages[i - 1];
    if (p.forced || i - 1 === 0 || p.el.classList.contains('first')) continue;
    const C = p.body.clientHeight, h = used(p.body);
    if (!h) continue;
    // ── 1) نرجّع الباقي للصفحة اللي قبله ونصغّرها شوية (لو الاتنين مع بعض يكفوا في صفحة)
    const u = used(prev.body), sNeed = C / (u + h + 6);
    if (sNeed >= 0.84){
      const moved = [], first = p.body.firstElementChild;
      let tm = null;
      if (first?.classList.contains('cont') && first.nextElementSibling?.tagName === 'TABLE' && prev.body.lastElementChild?.tagName === 'TABLE'){
        const src = first.nextElementSibling, dst = prev.body.lastElementChild.tBodies[0];
        tm = {first, src, rows: [...src.tBodies[0].children]}; tm.rows.forEach(r => dst.appendChild(r)); first.remove(); src.remove();
      }
      while (p.body.firstChild){ moved.push(p.body.firstChild); prev.body.appendChild(p.body.firstChild); }
      let s = Math.min(1, sNeed), ok = false;
      for (; s >= 0.84; s -= 0.02){ if (s < 1) wrap(prev.body, s); if (fits(prev.body, s)){ ok = true; break; } }
      if (ok){ p.el.remove(); pages.splice(i, 1); i--; continue; }
      // ماكفّاش: نرجّع كل حاجة زي ما كانت
      unwrap(prev.body); moved.forEach(n => p.body.appendChild(n));
      if (tm){ tm.rows.forEach(r => tm.src.tBodies[0].appendChild(r)); p.body.insertBefore(tm.src, p.body.firstChild); p.body.insertBefore(tm.first, tm.src); }
    }
    if (h > C * 0.42) continue;
    // ── 2) توازن بين الصفحتين
    if (p.body.firstElementChild?.classList.contains('cont')) continue;
    let guard = 0;
    while (used(p.body) < C * 0.42 && guard++ < 6){
      const last = prev.body.lastElementChild; if (!last || last.tagName === 'TABLE' || last.classList.contains('cont') || prev.body.children.length < 3) break;
      const grp = [last]; if (last.previousElementSibling?.classList.contains('kn')) grp.unshift(last.previousElementSibling);
      const before = p.body.firstChild; grp.forEach(n => p.body.insertBefore(n, before));
      if (over(p.body) || used(prev.body) < C * 0.5){ grp.forEach(n => prev.body.appendChild(n)); break; }
    }
  }
}

async function collectMedia(v){
  const [photos, sigs, thumbsArr, eng] = await Promise.all([
    Promise.all((v.photos||[]).map(async p => ({...p, src: await toDataUrl(p.asset, 700)}))),
    Promise.all(Object.entries(v.sig||{}).map(async ([role, s]) => ({role, ...s, src: s.asset ? await toDataUrl(s.asset) : ''}))),
    Promise.all((v.videos||[]).filter(x => x.thumb).map(async x => [x.asset, await toDataUrl(x.thumb, 500)])),
    v.engPhoto ? toDataUrl(v.engPhoto, 400) : '',
  ]);
  const wph = Object.fromEntries(await Promise.all((v.workers || []).filter(w => w.photo).map(async w => [w.id, await toDataUrl(w.photo, 320).catch(() => '')])));
  return {photos, sigs, thumbs: Object.fromEntries(thumbsArr), eng, wph};
}

async function cleanStorage(){
  if (!S.isOwner || !S.assets || S.busy) return;
  if (!S.visits.length) return;
  S.busy = true; S.confirm = null;
  $('#modal').innerHTML = `<div class="overlay center"><div class="busy" role="status"><div class="spin"></div><b>تنظيف المساحة</b><span class="small muted" id="pmsg" style="white-space:pre-line;text-align:center"></span></div></div>`;
  busyMsg('بيدوّر على الصور اللي مش مستخدمة…');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  try {
    const {assets: all} = await S.assets.list();
    const used = new Set(JSON.stringify(S.visits).match(/[0-9a-f]{32}/g) || []), cut = Date.now() - 24 * 3600e3;
    const orphans = all.filter(a => !used.has(a.id) && new Date(a.createdAt).getTime() < cut);
    let n = 0, bytes = 0;
    for (const a of orphans){
      busyMsg(`بيمسح الصور: ${n + 1} من ${orphans.length}`);
      for (let t = 0; t < 4; t++){ try { await S.assets.delete(a.id); n++; bytes += a.sizeBytes || 0; break; } catch(e){ if (e?.code === 'rate_limited') await sleep(1500 * (t + 1)); else break; } }
    }
    const after = await S.assets.list().catch(() => null), u = after?.usage;
    S.cleanRes = orphans.length ? `اتمسحت ${n} صورة (${(bytes / 1048576).toFixed(0)} ميجا).` : 'مفيش صور زيادة، المساحة نضيفة.';
    if (u) S.cleanRes += ` المستخدم دلوقتي: ${(u.bytes / 1048576).toFixed(0)} ميجا من ${(u.maxBytes / 1073741824).toFixed(0)} جيجا، و${u.files} صورة من ${u.maxFiles}.`;
  } catch(e){ S.cleanRes = 'ماقدرتش أكمل التنظيف (' + (e?.code || 'خطأ') + ')'; }
  finally { $('#modal').innerHTML = ''; S.busy = false; render(); }
}
function busyMsg(msg){

async function makePdf(v, onMsg){
  const W = 794, H = 1123, SC = 2;
  onMsg('جاري تجهيز الخطوط والصور…');
  const [fontCss, d] = await Promise.all([embedFonts(), collectMedia(v)]);
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:-30000px;top:0;width:${W}px`;
  host.innerHTML = `<style>${fontCss}${RP_CSS}</style><div class="rp"></div>`;
  document.body.appendChild(host);
  try {
    const root = host.querySelector('.rp');
    try { await document.fonts.ready; } catch {}
    onMsg('جاري ترتيب الصفحات…');
    const blocks = reportBlocks(v, d);
    // نخلّي الصور تتحمل قبل القياس
    const probe = tplEl(`<div>${blocks.filter(b => b.h).map(b => b.h).join('')}</div>`); root.appendChild(probe);
    await Promise.all([...probe.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(()=>{}) : null)); probe.remove();
    const pages = paginate(root, blocks, v);
    await Promise.all([...root.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(()=>{}) : null));
    const styleEl = host.querySelector('style');
    const jpegs = [];
    for (let i = 0; i < pages.length; i++){
      onMsg(`جاري تجهيز صفحة ${i+1} من ${pages.length}…`);
      const wrap = document.createElement('div'); wrap.appendChild(styleEl.cloneNode(true));
      const rp = document.createElement('div'); rp.className = 'rp'; rp.appendChild(pages[i].el.cloneNode(true)); wrap.appendChild(rp);
      const xml = new XMLSerializer().serializeToString(wrap);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">${xml}</foreignObject></svg>`;
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      await img.decode();
      const cv = document.createElement('canvas'); cv.width = W*SC; cv.height = H*SC;
      const ctx = cv.getContext('2d'); ctx.scale(SC, SC);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(img, 0, 0, W, H);
      // نرسم اللوجو مباشرة فوق الصفحة: بعض المتصفحات (زي سفاري على الآيفون) مابترسمش الصور اللي جوه الصفحة المحوّلة.
      // بنحدد مكانه من نفس الرسم (نسخة "قناع" فيها اللوجو مربعات ملونة) عشان المكان يبقى مضبوط بالظبط.
      try { await drawLogos(ctx, pages[i].el, styleEl, W, H); } catch(e){ console.warn('logo', e); }
      const blob = await new Promise((res, rej) => { try { cv.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', .9); } catch(e){ rej(e); } });
      jpegs.push(new Uint8Array(await blob.arrayBuffer()));
    }
    return buildPdf(jpegs, W*SC, H*SC);
  } finally { host.remove(); }
}
/* يرسم لوجو VTS على كانفاس الصفحة في نفس أماكن صوره بالظبط */
let _logoImg = null;
async function drawLogos(ctx, pageEl, styleEl, W, H){
  const logos = pageEl.querySelectorAll('img[alt="VTS"]');
  if (!logos.length) return;
  if (!_logoImg){ _logoImg = new Image(); _logoImg.src = VTS_LOGO; }
  await _logoImg.decode();
  const wrap = document.createElement('div'); wrap.appendChild(styleEl.cloneNode(true));
  const hide = document.createElement('style');
  hide.textContent = '.rp *{visibility:hidden!important}.rp .lgmask{visibility:visible!important;background-clip:content-box!important;border-color:transparent!important}';
  wrap.appendChild(hide);
  const rp = document.createElement('div'); rp.className = 'rp';
  const clone = pageEl.cloneNode(true);
  [...clone.querySelectorAll('img[alt="VTS"]')].forEach((im, k) => {
    const sp = document.createElement('span'); sp.className = (im.className ? im.className + ' ' : '') + 'lgmask';
    sp.style.cssText = `display:block;background:rgb(255,0,${40 + k*60})`;
    im.replaceWith(sp);
  });
  rp.appendChild(clone); wrap.appendChild(rp);
  const xml = new XMLSerializer().serializeToString(wrap);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}">${xml}</foreignObject></svg>`;
  const mi = new Image(); mi.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await mi.decode();
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const mc = cv.getContext('2d', {willReadFrequently:true}); mc.drawImage(mi, 0, 0, W, H);
  const px = mc.getImageData(0, 0, W, H).data;
  for (let k = 0; k < logos.length; k++){
    const blue = 40 + k*60; let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const o = (y*W + x)*4;
      if (px[o] > 230 && px[o+1] < 25 && Math.abs(px[o+2] - blue) < 12 && px[o+3] > 230){ if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y; }
    }
    if (x1 < 0) continue;
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1, r = _logoImg.naturalWidth / _logoImg.naturalHeight;
    let w = bw, h = bw / r; if (h > bh){ h = bh; w = bh * r; }
    ctx.fillStyle = '#fff'; ctx.fillRect(x0, y0, bw, bh);
    ctx.drawImage(_logoImg, x0 + (bw - w)/2, y0 + (bh - h)/2, w, h);
  }
}

function purgeCard(v){

function buildPdf(jpegs, pw, ph){
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n`); body(); push('\nendobj\n'); };
  const PW = 595.28, PH = 841.89, N = jpegs.length;
  push('%PDF-1.4\n'); push(new Uint8Array([37, 226, 227, 207, 211, 10]));
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Count ${N} /Kids [${jpegs.map((_, i) => `${3+3*i} 0 R`).join(' ')}] >>`));
  jpegs.forEach((j, i) => { const p = 3 + 3*i, cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(p, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    obj(p+1, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(p+2, () => { push(`<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`); push(j); push('\nendstream'); });
  });
  const xref = len, n = 3 + 3*N;
  push(`xref\n0 ${n}\n0000000000 65535 f \n` + Array.from({length: n-1}, (_, k) => String(offs[k+1]).padStart(10, '0') + ' 00000 n \n').join(''));
  push(`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type: 'application/pdf'});
}

      if (it.photo && !hasPhoto(S.visit, item)) toast('متنساش صورة السؤال'); return; }
    case 'sphoto': { const c = SEC_PH[b.dataset.g]; S.photoTarget = {item: c.id, cap: c.title}; pickSource('photo'); return; }
    case 'gphoto': S.photoTarget = {item: TOOLS_PH(b.dataset.g), cap: 'أدوات العمل — ' + SECTIONS_ALL.find(s => s.key === b.dataset.g).title}; pickSource('photo'); return;
    case 'vax': { if (locked()) return; const cur = vaxList(S.visit), x = b.dataset.v;
      const next = cur.includes(x) ? cur.filter(y => y !== x) : [...cur, x]; const ordered = VX_ORDER().filter(y => next.includes(y)).concat(next.filter(y => !VX_ORDER().includes(y)));
      S.visit.vaccines = ordered; S.visit.vaccine = ordered.join(' + '); patch({vaccines: ordered, vaccine: S.visit.vaccine}, true); renderMain(); return; }
    case 'wphoto': S.photoTarget = {item: WORKER_PH, cap: 'صور العمال أثناء التحصين'}; pickSource('photo'); return;
    case 'method': if (locked()) return; S.visit.method = b.dataset.v; patch({method: b.dataset.v}, true); renderMain(); return;
    case 'vsrc': if (locked()) return; S.visit.vsrc = b.dataset.v; patch({vsrc: b.dataset.v}, true); renderMain(); return;
    case 'nowtime': { if (locked()) return; const d = new Date(), t = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; S.visit[b.dataset.k] = t; patch({[b.dataset.k]: t}, true); renderMain(); return; }
    case 'team': if (locked()) return; S.visit.team = b.dataset.v; patch({team: b.dataset.v}, true); setSections(S.visit); render(); return;
    case 'pf': setResult(item, {r: b.dataset.v}); render(); return;
    case 'timer': if (S.timers[item]) stopTimer(item); else S.timers[item] = Date.now(); render(); return;
    case 'note': S.noteOpen = S.noteOpen === item ? null : item; render(); if (S.noteOpen) document.getElementById('note-'+item)?.focus(); return;
    case 'photo': S.photoTarget = {item, cap: BY_ID[item].label}; pickSource('photo'); return;
    case 'viewph': return viewPhoto(b.dataset.asset, !!b.dataset.del);
    case 'delph-yes': { const id = b.dataset.asset; S.visit.photos = (S.visit.photos || []).filter(p => p.asset !== id); $('#modal').innerHTML = '';
      await patch({photos: S.visit.photos}, true); try { await S.assets?.delete(id); } catch {} render(); toast('اتمسحت الصورة'); return; }
    case 'video': if (S.vbusy) return; if (!OFF.online){ toast('الفيديو محتاج نت'); return; } S.videoTarget = {item, slot: b.dataset.slot}; pickSource('video'); return;
    case 'src': clearTimeout(S.srcT); S.srcT = setTimeout(() => { if (!document.getElementById('vproc')) $('#modal').innerHTML = ''; }, 600); return; // الـ label بيفتح الكاميرا/المعرض بنفسه
    case 'srccancel': $('#modal').innerHTML = ''; S.photoTarget = null; S.videoTarget = null; return;
    case 'nophoto': if (!S.photoTarget?.item || locked()) return; noPhSheet(S.photoTarget.item); return;
    case 'nphwhy': { S.noPhWhy = b.dataset.v; document.querySelectorAll('.nphc').forEach(x => x.setAttribute('aria-checked', x === b)); const o = document.getElementById('nph-other'); if (o) o.value = ''; return; }
    case 'nphok': { const o = document.getElementById('nph-other')?.value.trim(), why = o || S.noPhWhy || NOPH_WHY[0];
      setNoPh(S.noPhK, {why, at: new Date().toISOString()}); $('#modal').innerHTML = ''; S.photoTarget = null; render(); toast('تم التسجيل: لا توجد صورة لهذا البند'); return; }
    case 'nphundo': setNoPh(b.dataset.k, null); render(); return;
    case 'wimport': case 'wimportall': { if (locked()) return; const pool = S.wpool || [], pick = a === 'wimportall' ? pool : [pool[+b.dataset.i]].filter(Boolean);
      const ws = S.visit.workers = [...(S.visit.workers || [])];
      pick.forEach((w, k) => ws.push({id: 'w' + Date.now().toString(36) + k, name: w.name, photo: w.photo || null, s: [newSample(), newSample(), newSample()]}));
      saveWorkers(true); render(); toast(pick.length > 1 ? `اتضاف ${pick.length} عمال. سجّل عيناتهم` : `اتضاف ${pick[0]?.name || 'العامل'}. سجّل عيناته`); return; }
    case 'delvideo': S.confirm = 'dv' + b.dataset.slot; render(); return;
    case 'delvideo-yes': { const slot = b.dataset.slot, it = b.dataset.item; const gone = (S.visit.videos||[]).filter(x => x.item === it && x.slot === slot);
      S.visit.videos = (S.visit.videos||[]).filter(x => !(x.item === it && x.slot === slot)); S.confirm = null;
      await patch({videos: S.visit.videos}, true); for (const o of gone){ try { await S.assets?.delete(o.asset); if (o.thumb) await S.assets?.delete(o.thumb); } catch {} } render(); return; }
    case 'engphoto': S.photoTarget = {eng:true}; pickSource('photo'); return;
    case 'sector': if (locked()) return; S.visit.sector = b.dataset.v; patch({sector: b.dataset.v}, true); render(); return;
    case 'goitem': if (b.dataset.ci) await switchClient(+b.dataset.ci); return goItem(+b.dataset.step, b.dataset.id);
    case 'client': return switchClient(+b.dataset.i);
    case 'addclient': return addClient();
    case 'delclient': S.confirm = 'delclient'; render(); return;
    case 'delclient-yes': return delClient();
    case 'addphoto': S.photoTarget = {item:null, cap: ($('#cap')?.value.trim()) || 'صورة إضافية'}; pickSource('photo'); return;
    case 'delphoto': S.confirm = 'ph' + b.dataset.i; render(); return;
    case 'delphoto-yes': { const i = +b.dataset.i; const p = S.visit.photos[i]; S.visit.photos = S.visit.photos.filter((_,j) => j !== i); S.confirm=null;
      await patch({photos:S.visit.photos}, true); try { await S.assets?.delete(p.asset); } catch {} render(); return; }
    case 'addworker': { const ws = S.visit.workers = [...(S.visit.workers||[])]; ws.push({id:'w'+Date.now().toString(36), name:'', s:[newSample(), newSample(), newSample()]});
      saveWorkers(true); render(); document.querySelector(`[data-wname="${ws.length-1}"]`)?.focus(); return; }
    case 'addsample': { const w = S.visit.workers[+b.dataset.w]; w.s = [...(w.s||[]), newSample()]; saveWorkers(true); render(); return; }
    case 'delworker': S.confirm = 'dw' + b.dataset.w; render(); return;
    case 'wkphoto': if (locked()) return; S.photoTarget = {worker: +b.dataset.w}; pickSource('photo'); return;
    case 'delworker-yes': { const gone = S.visit.workers[+b.dataset.w]; if (gone?.photo && !isLocalId(gone.photo) && !JSON.stringify(S.visit.clients || []).includes(gone.photo) && S.visit.workers.filter(x => x.photo === gone.photo).length < 2) { try { S.assets?.delete(gone.photo); } catch {} } }
      S.visit.workers = S.visit.workers.filter((_, i) => i !== +b.dataset.w); S.confirm = null; saveWorkers(true); render(); return;
    case 'cancel': S.confirm = null; render(); return;
    case 'delvisit': S.confirm = 'delvisit'; render(); return;
    case 'delvisit-yes': { const v = S.visit;
      OFF.dirty.delete(v.id); idbDel('visits', v.id); netPill();
      try { await S.db.doc('visits/' + v.id).delete(); for (const a of [...(v.workers||[]).map(w=>w.photo).filter(Boolean), ...(v.clients||[]).flatMap(c => [...(c.wph||[]).map(p=>p.asset), ...(c.workers||[]).map(w=>w.photo)]).filter(Boolean), ...(v.photos||[]).map(p=>p.asset), ...(v.videos||[]).flatMap(x=>[x.asset, x.thumb]).filter(Boolean), ...Object.values(v.sig||{}).map(s=>s.asset).filter(Boolean)]) { try { await S.assets?.delete(a); } catch {} } }
      catch(err){ toast('ماتمسحتش (' + (err.code||'خطأ') + ')'); return; }
      S.view='home'; S.visit=null; S.confirm=null; render(); toast('اتمسحت الزيارة'); return; }
    case 'sign': return openSign(b.dataset.role);
    case 'sigclear': { const c = $('#pad'), ctx = c.getContext('2d'); ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.restore(); c.dataset.empty='1'; return; }
    case 'sigsave': return saveSign(b.dataset.role);
    case 'sigcancel': case 'sigcancel-bg': S.vsheet = false; $('#modal').innerHTML=''; return;
    case 'report': return report();
    case 'purge': S.confirm = 'purge'; renderMain(); document.querySelector('.purge')?.scrollIntoView({block:'center'}); return;
    case 'purge-yes': return purgeMedia();
    case 'dlvideos': return downloadVideos();
    case 'dlvone': return dlVideos(+b.dataset.i);
    case 'dlvall': return dlVideos(null);
    case 'dlvzip': return dlVideosZip();
    case 'submit': {
      const sig = S.visit.sig || {};
      if (OFF.dirty.has(S.visit.id) || !OFF.online){ toast('الاعتماد وتنزيل الـ PDF محتاجين نت. الزيارة محفوظة على الموبايل، ولما النت يرجع والصور تترفع اعتمد على طول'); syncAll(); return; }
      if (!sig.engineer || !sig.manager){ toast('لازم التوقيعين قبل الاعتماد'); return; }
      { const n = pendingList(S.visit).length; if (n){ toast(`لسه ${n} سؤال أو صورة ناقصة. كمّلهم الأول`); window.scrollTo(0, 0); return; } }
      S.confirm = 'submit'; render(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50); return;
    }
    case 'submit-yes': {
      const sig = S.visit.sig || {};
      if (OFF.dirty.has(S.visit.id) || !OFF.online){ toast('استنى لحد ما النت يرجع والصور تترفع'); return; }
      if (pendingList(S.visit).length){ toast('لسه في أسئلة أو صور ناقصة'); return; }
      if (!sig.engineer || !sig.manager){ toast('لازم التوقيعين قبل الاعتماد'); return; }
      const at = new Date().toISOString(), g = grade(S.visit);
      S.visit.status = 'submitted'; S.visit.submittedAt = at; S.confirm = null;
      S.visit.finalScore = g.total == null ? null : Math.round(g.total*10)/10; S.visit.finalBand = g.band.l;
      if (multi(S.visit)){ S.visit.clients[S.visit.ci] = clSnap(S.visit);
        S.visit.clients.forEach((c, i) => { const gi = grade(clientView(S.visit, i)); c.finalScore = gi.total == null ? null : Math.round(gi.total*10)/10; c.finalBand = gi.band.l; }); }
      await patch({status:'submitted', submittedAt:at, notes:S.visit.notes||'', finalScore: S.visit.finalScore, finalBand: g.band.l, ...(multi(S.visit) ? {clients: S.visit.clients} : {})}, true);
      render(); toast('تم اعتماد التقرير. جاري تنزيل الـ PDF…');
      const kind = await report();
      if (kind === 'pdf') await purgeMedia(true);
      else if (!kind) toast('التقرير اتعتمد بس الـ PDF مانزلش. دوس "تقرير PDF" تاني، والصور هتفضل لحد ما ينزل');
      return;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.amp){ const c = t.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g, ''); if (c !== t.value) t.value = c;
    S.visit.amps = {...(S.visit.amps || {}), [t.dataset.amp]: c}; patch({amps: S.visit.amps}); }
  if (t.dataset.vb){ S.visit.vbatch = {...(S.visit.vbatch || {}), [t.dataset.vb]: t.value}; patch({vbatch: S.visit.vbatch}); }
  if (['birds', 'oilAmps', 'sprayAmps'].includes(t.dataset.field)){ const c = t.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^\d]/g, ''); if (c !== t.value) t.value = c; }
  if (t.dataset.field){ const k = t.dataset.field; S.visit[k] = t.value; patch({[k]: t.value}); if (k === 'hatchery') renderTop(); if (k === 'strain' || ((k === 'oil' || k === 'spray') && t.tagName === 'SELECT')) render(); if (k === 'client' && multi(S.visit)){ const cb = document.getElementById('it-clients'); if (cb) cb.outerHTML = clientBar(S.visit, 'info'); } if (k === 'workStart' || k === 'workEnd'){ const c = document.querySelector('#it-worktime .card-head'); if (c) c.innerHTML = `<h2><bdi dir="ltr">Working Time</bdi></h2>${workDur(S.visit) ? `<span class="chip pass"><bdi dir="ltr">Duration ${workDur(S.visit)}</bdi></span>` : ''}`; } }
  if (t.dataset.txt){ const id = t.dataset.txt; S.visit.results[id] = {...(S.visit.results[id]||{}), v: t.value}; patch({results:{[id]: S.visit.results[id]}}); }
  if (t.dataset.secnote){ const k = t.dataset.secnote; S.visit.secNotes = {...(S.visit.secNotes||{}), [k]: t.value}; patch({secNotes:{[k]: t.value}}); }
  if (t.dataset.note){ const id = t.dataset.note; S.visit.results[id] = {...(S.visit.results[id]||{}), n: t.value}; patch({results:{[id]: S.visit.results[id]}}); }
  if (t.dataset.wk){ const [wi, si, k] = t.dataset.wk.split(':'); const s = S.visit.workers[+wi].s[+si]; s[k] = toNum(t.value); refreshWorker(+wi); saveWorkers(); }
  if (t.dataset.wname){ S.visit.workers[+t.dataset.wname].name = t.value; saveWorkers(); }
  if (t.dataset.ss){ const n = toNum(t.value); S.visit.sampleSize = n; patch({sampleSize: n}); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.num){ const id = t.dataset.num, v = toNum(t.value);
    if (v !== ''){ setResult(id, {v, r: evaluate(BY_ID[id], v) ? 'pass' : 'fail'}); } else { setResult(id, {v:null, r:null}); }
    render(); }
});

/* ───────── التشغيل ───────── */
(async () => {
  render();
  const [db, assets, user, downloads] = await Promise.all(['db','assets','user','downloads'].map(n => claude.use(n)));
  if (!db){ S.failed = true; render(); return; }
  Object.assign(S, {db, assets, user, downloads});
  if (user){ const me = await user.me(); S.meId = me.id; S.meName = me.name || ''; }
  /* صاحب التطبيق بيشوف كل الزيارات، والمهندس بيشوف زياراته بس */
  try { S.isOwner = user && user.isOwner ? !!(await user.isOwner()) : true; } catch { S.isOwner = false; }
  if (!S.meId){ try { S.meId = localStorage.getItem('vts_device_id') || ('d' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)); localStorage.setItem('vts_device_id', S.meId); } catch { S.meId = 'd-anon'; } }
  S.canWrite = !!assets;
  for (const r of (await idbAll('visits')) || []) if (r?.id){ OFF.dirty.add(r.id); OFF.ver[r.id] = r.ver || 1; }
  netPill(); if (OFF.dirty.size) setTimeout(syncAll, 1500);
  db.collection('visits').orderBy('startedAt', 'desc').limit(300).onSnapshot(async snap => {
    S.visits = snap.docs.map(d => ({id: d.id, results:{}, ...d.data()}));
    for (const r of (await idbAll('visits')) || []){ if (!r?.id || !OFF.dirty.has(r.id)) continue; const i = S.visits.findIndex(x => x.id === r.id), o = {id: r.id, results:{}, ...r.doc}; if (i >= 0) S.visits[i] = o; else S.visits.unshift(o); }
    S.ready = true;
    const ids = [...new Set(S.visits.map(v => v.engineerId).filter(Boolean))];
    if (user && ids.length){ const ps = await user.profiles(ids); for (const id of ids) S.names[id] = ps[id]?.name || ''; }
    if (S.view === 'home' || S.view === 'dash') render();
  }, err => { S.ready = true; S.failed = err.code === 'revoked'; if (S.view === 'home') render(); });
})();
